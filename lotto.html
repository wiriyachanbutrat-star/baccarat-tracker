<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>คำนวณหวยลาว 4 ตัวตรง</title>
  <link rel="stylesheet" href="lotto.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="table-frame">
    <header>
      <p class="eyebrow">Lao Lottery Helper</p>
      <h1>คำนวณหวยลาว 4 ตัวตรง</h1>
      
      <div class="nav-row">
        <a class="nav-link" href="index.html">← ไปหน้าเว็บบาคาร่า</a>
        <a class="nav-link" href="loan.html">ระบบบันทึกเงินกู้ →</a>
        <a class="nav-link" href="https://don-app-csii.onrender.com" target="_blank" rel="noopener">วิเคราะห์ทองคำ (XAUUSD) →</a>
      </div>
    </header>

    <div class="layout">
      <div class="col">
        <section class="card">
          <h2 class="section-title">หวยช่อง 1</h2>
          <p class="hint">กรอกเลข 6 หลัก</p>
          <div class="draw-row">
            <span class="draw-label">หวยช่อง 1</span>
            <input type="text" inputmode="numeric" maxlength="6" class="draw-input" id="channel1" placeholder="000000">
          </div>
        </section>

        <section class="card">
          <h2 class="section-title">แยกเลขแต่ละหลัก</h2>
          <div class="freq-grid" id="channel1Digits">
            <div class="freq-tile"><span class="freq-digit">—</span></div>
            <div class="freq-tile"><span class="freq-digit">—</span></div>
            <div class="freq-tile"><span class="freq-digit">—</span></div>
            <div class="freq-tile"><span class="freq-digit">—</span></div>
            <div class="freq-tile"><span class="freq-digit">—</span></div>
            <div class="freq-tile"><span class="freq-digit">—</span></div>
          </div>
        </section>

        <section class="card" hidden>
          <h2 class="section-title">คำนวณผล 3 ตัว</h2>
          <div class="result-row">
            <div class="result-card" id="result3OldCard">
              <p class="headline" id="result3Old">—</p>
            </div>
            <div class="result-card" id="result3Card">
              <p class="headline" id="result3">— — —</p>
            </div>
          </div>

          <div class="result-row" style="margin-top:0.7rem;">
            <div class="result-card" id="result3bOldCard">
              <p class="headline" id="result3bOld">—</p>
            </div>
            <div class="result-card" id="result3bCard">
              <p class="headline" id="result3b">—</p>
            </div>
          </div>

          <div class="result-row" style="margin-top:0.7rem;">
            <div class="result-card" id="result3cOldCard">
              <p class="headline" id="result3cOld">—</p>
            </div>
            <div class="result-card" id="result3cCard">
              <p class="headline" id="result3c">—</p>
            </div>
          </div>

        </section>
      </div>

      <div class="col">
        <section class="card" hidden>
          <h2 class="section-title">คำนวณหวย 2 ตัว</h2>
          <div class="result-row">
            <div class="result-card" id="result2aOldCard">
              <p class="headline" id="result2aOld">—</p>
            </div>
            <div class="result-card" id="result2aCard">
              <p class="headline" id="result2a">—</p>
            </div>
          </div>

          <div class="result-row" style="margin-top:0.7rem;">
            <div class="result-card" id="result2bOldCard">
              <p class="headline" id="result2bOld">—</p>
            </div>
            <div class="result-card" id="result2bCard">
              <p class="headline" id="result2b">—</p>
            </div>
            <div class="result-card" id="result2bPlus2Card">
              <p class="headline" id="result2bPlus2">—</p>
            </div>
          </div>

        </section>
      </div>
    </div>

    <section class="card">
      <h2 class="section-title">ผลคำนวณ</h2>
      <p class="label">ผล 3 ตัว</p>
      <div class="combo-groups">
        <div class="combo-group">
          <div class="combo-grid" id="comboGroupOld"></div>
        </div>
        <div class="combo-group">
          <div class="combo-grid" id="comboGroupNew"></div>
        </div>
      </div>

      <p class="label" style="margin-top:0.7rem;">ผล 2 ตัว</p>
      <div class="combo-groups">
        <div class="combo-group">
          <div class="combo-grid combo-grid-3" id="combo2GroupOld"></div>
        </div>
        <div class="combo-group">
          <div class="combo-grid combo-grid-3" id="combo2GroupNew"></div>
        </div>
      </div>
    </section>

    
  <script src="lotto.js"></script>
</body>
</html>
